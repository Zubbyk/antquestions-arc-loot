<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Antquestions loot</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <div class="brand" title="Antquestions loot">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">Antquestions loot</div>
      </div>

      <div class="search" role="search">
        <span class="icon">🔎</span>
        <input id="searchInput" placeholder="Поиск… (оружие ищется и по ингредиентам)" autocomplete="off" />
        <span class="kbd" title="Фокус на поиск">/</span>
      </div>

      <div class="controls">
        <div class="seg" role="group" aria-label="Раздел">
          <button class="segbtn active" data-view="all">Все</button>
          <button class="segbtn" data-view="base">Убежище</button>
          <button class="segbtn" data-view="weapons">Крафт оружия</button>
        </div>

        <div class="miniActions">
          <button class="btn" id="btnExport" title="Ctrl+S">Экспорт</button>
          <label class="btn" title="Ctrl+O" style="cursor:pointer;">
            Импорт
            <input id="fileImport" type="file" accept="application/json" style="display:none;">
          </label>
          <button class="btn danger" id="btnImportReplace" title="Заменить текущий прогресс прогрессом из файла">
            Импорт (замена)
          </button>
        </div>
      </div>
    </div>

    <div class="pillrow" id="categoryPills"></div>
  </div>
</header>

<main>
  <div class="notice" id="noResults">Ничего не найдено 😶</div>
  <div class="grid" id="grid"></div>
</main>

<div class="toast" id="toast"></div>

<footer class="footer">
  <a class="tg-fab" href="https://t.me/antquestions52" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21.4 3.6c.6-.25 1.2.3 1 1l-3.3 15.5c-.08.38-.44.66-.84.66-.03 0-.06 0-.09-.01l-5.9-1.9-2.7 2.6c-.36.34-.96.12-1.01-.38l-.4-4.3 10.2-9.5c.2-.2-.05-.5-.3-.35l-12.3 7.6-4.6-1.5c-.7-.23-.72-1.2-.03-1.46L21.4 3.6z"/>
    </svg>
  </a>
</footer>

<script src="./js/data_base.js"></script>
<script src="./js/data_weapons.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/render_base.js"></script>
<script src="./js/render_weapons.js"></script>
<script src="./js/search.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
